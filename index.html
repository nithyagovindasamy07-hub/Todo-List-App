

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <form id="todoForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                aria-label="New task"
                required
            >
            <button type="submit" id="submitBtn">Add Task</button>
        </form>

        <div class="filters" aria-label="Filter tasks">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>

        <p id="taskCount" aria-live="polite">0 tasks remaining</p>
        <ul id="taskList"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
